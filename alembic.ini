[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for migration file "Create Date" comments (blank = local time).
timezone =

# sys.path additions so env.py can import project code if it ever needs to.
prepend_sys_path = .

# Version location handling (single versions/ dir - default, kept explicit
# for clarity since some Alembic versions warn without it).
version_path_separator = os

# NOTE: no sqlalchemy.url here on purpose. The DB connection string comes
# from the DATABASE_URL environment variable at runtime (see alembic/env.py),
# the same way api/main.py and collector/collector.py already read it -
# never hardcode credentials into this file.

[post_write_hooks]
# No post-write hooks configured (no black/ruff auto-format wired up here).

# ---------------------------------------------------------------------------
# Logging configuration (Alembic's standard default - controls how much
# noise `alembic` CLI commands print, unrelated to the app's own logging).
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
